# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Save the session layout every hour so `txsess restore` stays current.
# The loop is guarded, so re-sourcing this file won't spawn extra savers.
run-shell -b '~/Dev/dotfiles/tmux/tmux-autosave.sh'

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Forward cmux's per-surface socket credentials into the tmux session env on
# attach, so the cmux CLI (and the `nw` alias) can reach the app from inside
# tmux. Re-attach a session once from a cmux surface to populate these.
set -ga update-environment CMUX_SOCKET_PASSWORD
set -ga update-environment CMUX_WORKSPACE_ID
set -ga update-environment CMUX_SURFACE_ID
